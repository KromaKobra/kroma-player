[pytest]
testpaths = tests

# Applied by tests/conftest.py from the fixture closure, not by hand — see
# pytest_collection_modifyitems there for why, and for what the split is for.
#
#   pytest -m "not gui"    the inner loop: no engine, ~60s
#   pytest                 everything, before pushing
markers =
    gui: needs a QGuiApplication and a loaded QML engine — the slow ones.
    plugin_process: starts a real plugin process (tests/fixtures/plugins/echo) through the plugin host.

# Two deprecations inside our own dependencies, each raised once per ORM object
# built: together they were 284k lines of a full run, which buries anything
# worth reading. Silenced by message rather than by category so a *new*
# DeprecationWarning still shows up.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
    ignore:The ``declarative_base\(\)`` function is now available:DeprecationWarning
