name: checks

# Everywhere except a tag. `dev` is where integration happens and `main` is only
# ever reached through a pull request, so running on pushes to `dev` and to
# feature branches, plus on every PR into either, covers each commit exactly
# once without covering it twice.
#
# Deliberately not on `push: main`: nothing pushes to `main` directly, and a tag
# on it is release.yml's job, which runs these same two commands behind its own
# guard before it builds anything.
on:
  push:
    branches:
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # PySide6 ships the Qt libraries but not the system ones they link
      # against. The suite runs on the offscreen platform plugin
      # (tests/conftest.py sets QT_QPA_PLATFORM), which still needs the X11 and
      # GL client libraries present to load at all — the failure without them is
      # "could not load the Qt platform plugin", from a test that never touches
      # a window.
      - name: Install Qt's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libpulse0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: pytest
        run: python -m pytest -q

      # The documentation checks are part of the build rather than a habit:
      # every backticked path resolves, every symbol() exists, every view model
      # in CONTEXT_PROPERTIES is documented. See scripts/check-docs.
      #
      # Reported but not failing while docs/ is temporary: it is being rewritten
      # outside the repository and is knowingly stale. Make this blocking again
      # once docs/ is back.
      - name: check-docs
        continue-on-error: true
        run: python scripts/check-docs
